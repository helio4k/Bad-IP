name: Fetch TweetFeed Blocklist

on:
  schedule:
    # Runs automatically every 20 minutes
    - cron: '*/20 * * * *'
  # Allows manual triggers from the Actions tab
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-24.04
    steps:
      # Step 1: Initialize the repository workspace
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Clear the typo link, call the real API, and overwrite the "IP" file directly
      - name: Fetch Latest IPs
        run: |
          curl -fsS -o IP https://api.tweetfeed.live/v1/blocklist/ips.txt

      # Step 3: Commit and Push changes safely
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add IP
          
          # Only commit if TweetFeed actually updated their list
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update tweetfeed blocklist [skip ci]"
            git push
          else
            echo "No new IP updates detected."
          fi
