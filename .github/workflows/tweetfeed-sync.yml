name: Fetch TweetFeed Blocklist

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: 

jobs:
  download-and-commit:
    runs-on: ubuntu-24.04
    steps:
      # Use an exact official version tag instead of the broken commit hash
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest IPs
        run: |
          mkdir -p IP
          curl -fsS -o IP/tweetfeed_ips.txt https://api.tweetfeed.live/v1/blocklist/ips.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add IP/tweetfeed_ips.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update tweetfeed blocklist [skip ci]"
            git push
          else
            echo "No new IP updates detected."
          fi
