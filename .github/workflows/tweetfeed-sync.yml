name: Fetch TweetFeed Blocklist

on:
  schedule:
    # Runs automatically every 20 minutes
    - cron: '*/20 * * * *'
  # Allows manual triggers from the Actions tab
  workflow_dispatch: 

jobs:
  download-and-commit:
    runs-on: ubuntu-24.04
    steps:
      # Step 1: Force GitHub to pull the Node 24 version by using the explicit commit SHA
      - name: Checkout Repository
        uses: actions/checkout@eef6142ac128cdb7014cb933157cada9994342ee # Pinned to v4.2.1 (compiled for Node 24)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Download the plain text IP list into your existing IP folder
      - name: Fetch Latest IPs
        run: |
          mkdir -p IP
          curl -fsS -o IP/tweetfeed_ips.txt https://api.tweetfeed.live/v1/blocklist/ips.txt

      # Step 3: Commit and Push changes safely
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add IP/tweetfeed_ips.txt
          
          # Only commit if TweetFeed actually updated their list
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update tweetfeed blocklist [skip ci]"
            git push
          else
            echo "No new IP updates detected."
          fi
